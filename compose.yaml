services:
  api:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    ports:
      - "8000:8000"

  scheduler:
    build: .
    command: ["python", "-m", "scripts.run_scheduler"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    profiles: ["scheduler"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on: [api]
